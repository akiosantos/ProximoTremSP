<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Próximo Trem</title>
    <style>
        :root {
            --bg-dark: #0f172a;
            --primary: #2563eb;
            --success: #16a34a;
            --text: #f8fafc;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            background: var(--bg-dark);
            color: var(--text);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        header {
            padding: 1rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        h1 { margin: 0 0 15px 0; font-size: 1.5rem; }

        .botoes {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            max-width: 900px;
            margin: 0 auto;
        }

        button {
            padding: 10px 14px;
            border: none;
            border-radius: 8px;
            background: var(--primary);
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 0.85rem;
        }

        button:hover { transform: translateY(-2px); filter: brightness(1.1); }
        button:active { transform: translateY(0); }
        button.active { background: var(--success); box-shadow: 0 0 10px rgba(22, 163, 74, 0.4); }

        .container-trem {
            flex-grow: 1;
            position: relative;
            background: white;
            margin-top: 15px;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Indicador de carregamento simples */
        .loader {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            color: #333;
            z-index: -1;
        }
    </style>
</head>
<body>

<header>
    <h1>🚆 Próximo Trem</h1>
    <div class="botoes" id="lista-estacoes">
        </div>
</header>

<div class="container-trem">
    <div class="loader">Carregando horários...</div>
    <iframe id="trem" title="Painel ViaMobilidade"></iframe>
</div>

<script>
    const estacoes = [
        { nome: 'Barueri', id: 'BRU', linha: 'L8' },
        { nome: 'Antônio João', id: 'AJO', linha: 'L8' },
        { nome: 'Itapevi', id: 'IPV', linha: 'L8' },
        { nome: 'Osasco L8', id: 'OSA', linha: 'L8', externa: true },
        { nome: 'Osasco L9', id: 'OSA', linha: 'L9', externa: true },
        { nome: 'Jandira', id: 'JDI', linha: 'L8' },
        { nome: 'Barra Funda', id: 'BFU', linha: 'L8' }
    ];

    const iframe = document.getElementById("trem");
    const containerBotoes = document.getElementById("lista-estacoes");

    function renderizarBotoes() {
        estacoes.forEach(est => {
            const btn = document.createElement('button');
            btn.innerHTML = est.nome + (est.externa ? ' ↗' : '');
            btn.onclick = () => carregarEstacao(est, btn);
            containerBotoes.appendChild(btn);
            
            // Define Barueri como inicial
            if(est.id === 'BRU') btn.classList.add('active');
        });
    }

    function carregarEstacao(est, elemento) {
        const url = `https://proximotrem.viamobilidade.com.br/?linha=${est.linha}&estacao_origem=${est.id}`;
        
        if (est.externa) {
            window.open(url, '_blank');
        } else {
            document.querySelectorAll('button').forEach(b => b.classList.remove('active'));
            elemento.classList.add('active');
            iframe.src = url;
        }
    }

    window.onload = () => {
        renderizarBotoes();
        iframe.src = 'https://proximotrem.viamobilidade.com.br/?linha=L8&estacao_origem=BRU';
    };
</script>
</body>
</html>
